name: Retrain

# Daily scheduled retrain: pull fresh price data, re-train the model with fresh
# walk-forward validation, re-run the backtest, and commit the refreshed
# artifacts back to the repo. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "30 21 * * 1-5" # 21:30 UTC, Mon-Fri — after US market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests before touching production artifacts
        run: pytest -v

      - name: Retrain model
        run: python -m src.model

      - name: Run backtest
        run: python -m src.backtest

      - name: Commit updated artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ reports/
          git diff --cached --quiet || git commit -m "Scheduled retrain: $(date -u +'%Y-%m-%d')"
          git push
